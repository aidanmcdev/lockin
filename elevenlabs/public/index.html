<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Focus Tracker</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background: #0a0a0a;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: monospace;
        gap: 16px;
      }

      .stage {
        position: relative;
        width: 480px;
        height: 360px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #222;
      }

      .stage video, .stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      #status {
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #555;
      }

      #status.focused {
        color: #00ffaa;
      }

      #timeline {
        border-radius: 4px;
        display: block;
      }

      .timeline-label {
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #333;
        align-self: flex-start;
        margin-bottom: -10px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
    </div>

    <div id="status">Starting...</div>

    <span class="timeline-label">Last 60s</span>
    <canvas id="timeline" width="480" height="28"></canvas>

    <script type="module" src="./app.js"></script>

    <script>
      // Timeline: stores {t, focused} samples, draws last 60s
      const WINDOW_S = 60;
      const history = [];
      const tlCanvas = document.getElementById('timeline');
      const tlCtx = tlCanvas.getContext('2d');

      function drawTimeline() {
        const W = tlCanvas.width;
        const H = tlCanvas.height;
        const now = performance.now() / 1000;
        tlCtx.clearRect(0, 0, W, H);

        // Background
        tlCtx.fillStyle = '#111';
        tlCtx.fillRect(0, 0, W, H);

        // Draw each sample as a vertical slice
        for (let i = 1; i < history.length; i++) {
          const prev = history[i - 1];
          const curr = history[i];
          const x0 = ((prev.t - (now - WINDOW_S)) / WINDOW_S) * W;
          const x1 = ((curr.t - (now - WINDOW_S)) / WINDOW_S) * W;
          tlCtx.fillStyle = prev.focused ? '#00cc88' : '#cc3333';
          tlCtx.fillRect(Math.max(0, x0), 0, x1 - x0, H);
        }

        // Trailing edge for current state
        if (history.length > 0) {
          const last = history[history.length - 1];
          const x0 = ((last.t - (now - WINDOW_S)) / WINDOW_S) * W;
          tlCtx.fillStyle = last.focused ? '#00cc88' : '#cc3333';
          tlCtx.fillRect(Math.max(0, x0), 0, W - x0, H);
        }

        // Tick marks every 10s
        tlCtx.fillStyle = 'rgba(255,255,255,0.15)';
        for (let s = 10; s < WINDOW_S; s += 10) {
          const x = (s / WINDOW_S) * W;
          tlCtx.fillRect(x - 0.5, 0, 1, H);
        }

        requestAnimationFrame(drawTimeline);
      }

      drawTimeline();

      window.setFocusState = function(focused) {
        const statusEl = document.getElementById('status');
        const now = performance.now() / 1000;

        // Record sample
        history.push({ t: now, focused });

        // Prune old entries outside window
        const cutoff = now - WINDOW_S - 1;
        while (history.length > 1 && history[0].t < cutoff) history.shift();

        if (focused) {
          statusEl.classList.add('focused');
          statusEl.textContent = 'Focused';
        } else {
          statusEl.classList.remove('focused');
          statusEl.textContent = 'Not Focused';
        }
      };
    </script>
  </body>
</html>
